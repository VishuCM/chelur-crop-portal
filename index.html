<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174d35"><link rel="manifest" href="manifest.webmanifest"><title>Chelur Crop Portal</title><style>
:root{--g:#174d35;--gd:#0f3d29;--p:#eaf4ed;--line:#cbd9cf;--ink:#18231c;--muted:#627267;--stripe:#f4f8f5}
*{box-sizing:border-box}
body{margin:0;background:#f3f7f4;color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(115deg,var(--gd),var(--g));color:white;padding:22px 18px;border-radius:0 0 20px 20px}
header h1{margin:10px 0 3px;font-size:24px;letter-spacing:-.3px}
header p{margin:0;color:#d5e8da}
main{max-width:1180px;margin:auto;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab,.btn{border:0;border-radius:12px;padding:12px;font:inherit;font-weight:750}
.tab{flex:1;background:white;color:var(--g);border:1px solid var(--line);cursor:pointer}
.active,.btn{background:var(--g);color:white}
.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:14px;box-shadow:0 2px 8px #173d2710}
.panel h3{margin:2px 0 12px;font-size:18px}
.field{margin:9px 0}
label{display:block;font-size:11px;font-weight:800;letter-spacing:.35px;color:var(--muted);margin-bottom:5px}
select,input{width:100%;padding:12px;border:1px solid #cbd8cf;border-radius:10px;background:white;font:inherit;color:var(--ink)}
select:focus,input:focus{outline:2px solid #9bc8a8;outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.metric{background:linear-gradient(135deg,#edf7ef,#e4f1e7);padding:12px;border:1px solid #d7e9db;border-radius:12px}
.metric small{display:block;color:var(--muted);font-weight:600}
.metric b{display:block;font-size:20px;line-height:1.35;font-weight:800;color:#173e29}
.tablewrap{overflow:auto;border:1px solid #b9cbbf;border-radius:11px;margin:10px 0;background:white}
table{border-collapse:collapse;width:100%;min-width:700px;font-size:12px}
th,td{padding:9px 10px;border:1px solid #d2ddd5;text-align:right;white-space:nowrap}
th{background:#e7f1e9;color:#204a31;font-weight:850;border-color:#bdcec2}
td{font-weight:500}
tbody tr:nth-child(even),table tr:nth-child(even){background:var(--stripe)}
th:first-child,td:first-child{text-align:left}
.total{font-weight:850!important;background:#e1f2e3!important;color:#143c27}
.total td{font-weight:850!important;border-top:2px solid #8eb99a}
.tablewrap table tr:hover td{background:#edf6ef}
.btn{width:100%;margin-top:10px;cursor:pointer}
.muted{font-size:12px;color:var(--muted)}
.hidden{display:none}
.status{font-size:12px;color:#d5e8da;margin-top:8px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
@media print{header,.tabs,.filters,.btn{display:none!important}body{background:white}.panel{box-shadow:none;border:0;padding:0}.tablewrap{overflow:visible}table{font-size:9px;min-width:0}th,td{padding:5px;border:1px solid #999}}
</style></head><body><header><b>🌱 CHELUR · FIELD ASSISTANT PORTAL</b><h1>Crop & Purchase Information</h1><p>Current-season farmer records</p><div id="status" class="status">Connecting…</div></header><main><div class="tabs"><button class="tab active" data-v="fruit">🍈 Fruit Purchases</button><button class="tab" data-v="crop">🌿 Crop Analysis</button></div><section id="fruit"><div class="panel filters"><h3>Find purchase records</h3><div class="field"><label>FIELD ASSISTANT</label><select id="ffa"><option value="">All Field Assistants</option></select></div><div class="field"><label>FARMER</label><select id="ffarmer"><option value="">All Farmers</option></select></div><div class="field"><label>SEARCH ACCOUNT NUMBER</label><input id="fsearch" placeholder="Farmer account number"></div></div><div id="fout"></div></section><section id="crop" class="hidden"><div class="panel filters"><h3>Crop analysis</h3><div class="field"><label>FILTER BY FIELD ASSISTANT</label><select id="cfa"><option value="">All Field Assistants</option></select></div><div class="field"><label>SEARCH FARMER</label><input id="csearch" placeholder="Code or farmer name"></div></div><div id="cout"></div></section></main><script src="app.js"></script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));</script></body></html>
