<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174d35"><link rel="manifest" href="manifest.webmanifest"><title>Chelur Crop Portal</title><style>
:root{--g:#174d35;--p:#eaf4ed;--line:#dce5df}*{box-sizing:border-box}body{margin:0;background:#f5f8f5;color:#18231c;font:15px system-ui}header{background:var(--g);color:white;padding:22px 18px;border-radius:0 0 20px 20px}header h1{margin:10px 0 3px;font-size:24px}header p{margin:0;color:#d5e8da}main{max-width:1100px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab,.btn{border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700}.tab{flex:1;background:white;color:var(--g);border:1px solid var(--line)}.active,.btn{background:var(--g);color:white}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:14px}.field{margin:9px 0}label{display:block;font-size:11px;font-weight:700;color:#68766d;margin-bottom:5px}select,input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;font:inherit}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric{background:var(--p);padding:12px;border-radius:12px}.metric small{display:block;color:#68766d}.metric b{font-size:20px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;margin:10px 0}table{border-collapse:collapse;width:100%;min-width:700px;font-size:12px}th,td{padding:9px;border-bottom:1px solid #edf1ed;text-align:right;white-space:nowrap}th{background:#edf4ef;color:#244a32}th:first-child,td:first-child{text-align:left}.total{font-weight:800;background:#f4f8f4}.btn{width:100%;margin-top:10px}.muted{font-size:12px;color:#68766d}.hidden{display:none}.status{font-size:12px;color:#d5e8da;margin-top:8px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}@media print{header,.tabs,.filters,.btn{display:none!important}body{background:white}}
</style></head><body><header><b>🌱 CHELUR · FIELD ASSISTANT PORTAL</b><h1>Crop & Purchase Information</h1><p>Current-season farmer records</p><div id="status" class="status">Connecting…</div></header><main><div class="tabs"><button class="tab active" data-v="fruit">🍈 Fruit Purchases</button><button class="tab" data-v="crop">🌿 Crop Analysis</button></div><section id="fruit"><div class="panel filters"><h3>Find purchase records</h3><div class="field"><label>FIELD ASSISTANT</label><select id="ffa"><option value="">All Field Assistants</option></select></div><div class="field"><label>FARMER</label><select id="ffarmer"><option value="">All Farmers</option></select></div><div class="field"><label>SEARCH ACCOUNT NUMBER</label><input id="fsearch" placeholder="Farmer account number"></div></div><div id="fout"></div></section><section id="crop" class="hidden"><div class="panel filters"><h3>Crop analysis</h3><div class="field"><label>FILTER BY FIELD ASSISTANT</label><select id="cfa"><option value="">All Field Assistants</option></select></div><div class="field"><label>SEARCH FARMER</label><input id="csearch" placeholder="Code or farmer name"></div></div><div id="cout"></div></section></main><script src="app.js"></script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));</script></body></html>
